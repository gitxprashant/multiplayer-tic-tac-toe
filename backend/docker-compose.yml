version: '3'
services:
  nakama:
    image: heroiclabs/nakama
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        nakama --name nakama1 --database.address postgres:localdb@postgres:5432/nakama
        --logger.level DEBUG --session.token_expiry_sec 7200
    ports:
      - "7350:7350"
      - "7351:7351"
    depends_on:
      - postgres

  postgres:
    image: postgres:12
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: localdb
      POSTGRES_PASSWORD: localdb